name: Scheduled Drift Forecast

on:
  schedule:
    - cron: '30 2 */2 * *'  # Every 2 days at 02:30 UTC (after data download at 02:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    container:
      image: opendrift/opendrift:latest
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      - name: Check data availability
        id: data-check
        run: |
          if ls data/nc_converted/*.nc 1>/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✅ NC files found in repo checkout"
            ls -lh data/nc_converted/*.nc
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No NC files found, will try cache then download"
          fi

      - name: Restore cached CWA data
        if: steps.data-check.outputs.found != 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/nc_converted
          key: cwa-nc-v2-
          restore-keys: cwa-nc-v2-

      - name: Ensure cfgrib available
        if: steps.data-check.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: /opt/conda/bin/python3 -c "import cfgrib" 2>/dev/null || /opt/conda/bin/micromamba install -y -n base -c conda-forge cfgrib eccodes

      - name: Fallback - download fresh data
        if: steps.data-check.outputs.found != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          /opt/conda/bin/python3 scripts/download_seacurrent_nc.py \
            --output data/nc_files \
            --wind --wind-output data/grib2_files \
            --gfs --gfs-output data/grib2_m_a0060
          /opt/conda/bin/python3 scripts/convert_seacurrent_for_drift.py \
            --input-dir data/nc_files \
            --output-dir data/nc_converted \
            --wind-input-dir data/grib2_files \
            --gfs-input-dir data/grib2_m_a0060

      - name: Generate velocity JSON for map visualization
        run: |
          /opt/conda/bin/pip install -q scipy 2>/dev/null || true
          /opt/conda/bin/python3 scripts/generate_velocity_json.py \
            --input-dir data/nc_converted \
            --output-dir scheduled_results \
            --current-step 2 --wind-step 2 --precision 2

      - name: Generate per-hour frames (current + wind + GFS multi-level)
        run: |
          /opt/conda/bin/python3 scripts/generate_velocity_json.py \
            --input-dir data/nc_converted \
            --output-dir scheduled_results \
            --frames --max-hours 72 \
            --current-step 2 --wind-step 2 --gfs-step 4 --precision 2

      - name: Run 5-point forecast simulations
        run: /opt/conda/bin/python3 scripts/run_scheduled_forecasts.py

      - name: Upload forecast results
        uses: actions/upload-artifact@v4
        with:
          name: forecast-results
          path: scheduled_results/

  commit:
    needs: forecast
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: forecast-results
          path: scheduled_results/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scheduled_results/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update scheduled drift forecast $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main
