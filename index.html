<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaCurrent Drift Simulator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #0a1628;
            color: #e0e6ed;
            min-height: 100vh;
        }
        .layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: #101d33;
            border-right: 1px solid #1e3050;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            font-size: 1.3em;
            margin-bottom: 4px;
            color: #fff;
        }
        .subtitle {
            color: #7a8fa6;
            font-size: 0.85em;
            margin-bottom: 16px;
        }
        .subtitle a { color: #5ba3f5; text-decoration: none; }
        .subtitle a:hover { text-decoration: underline; }

        /* Sim type cards */
        .sim-type-cards { display: flex; gap: 6px; margin-bottom: 16px; }
        .sim-card {
            flex: 1;
            padding: 10px 6px;
            border: 2px solid #1e3050;
            border-radius: 8px;
            background: #152238;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            color: #8a9bb5;
        }
        .sim-card:hover { border-color: #3a6ea5; background: #182d4a; }
        .sim-card.active { border-color: #4a9eff; background: #1a3558; color: #fff; }
        .sim-card .sim-icon { font-size: 1.4em; display: block; margin-bottom: 4px; }
        .sim-card .sim-label { font-weight: 600; display: block; font-size: 0.8em; }

        /* Form */
        .form-section { margin-bottom: 12px; }
        label { font-weight: 600; font-size: 0.82em; color: #8a9bb5; display: block; margin-bottom: 3px; }
        input, select {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #1e3050;
            border-radius: 6px;
            background: #0d1a2e;
            color: #e0e6ed;
            margin-bottom: 10px;
        }
        input:focus, select:focus { border-color: #4a9eff; outline: none; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .param-group {
            padding: 10px;
            background: #152238;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #1e3050;
        }
        .model-params { display: none; }
        .model-params.visible { display: block; }
        .map-hint {
            font-size: 0.78em;
            color: #5a7a9a;
            margin: -6px 0 10px 0;
        }

        .submit-btn {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .submit-btn:hover { background: #1d4ed8; }
        .submit-btn:disabled { background: #374151; cursor: not-allowed; color: #6b7280; }

        /* Status messages */
        #success { color: #34d399; margin-top: 10px; font-size: 0.88em; }
        #error { color: #f87171; margin-top: 10px; font-size: 0.88em; }
        #logs {
            font-family: monospace;
            font-size: 0.78em;
            color: #7a8fa6;
            margin-top: 8px;
            white-space: pre-wrap;
        }

        /* Map */
        .map-container {
            flex: 1;
            position: relative;
        }
        #map { width: 100%; height: 100%; }
        .map-overlay {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(16, 29, 51, 0.9);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82em;
            color: #8a9bb5;
            z-index: 1000;
            backdrop-filter: blur(8px);
            border: 1px solid #1e3050;
        }
        .map-overlay .coord-display { color: #4a9eff; font-weight: 600; font-size: 1em; }

        /* Responsive - Tablet */
        @media (max-width: 900px) {
            .sidebar { width: 300px; min-width: 300px; padding: 16px; }
        }

        /* Responsive - Mobile */
        @media (max-width: 700px) {
            .layout { flex-direction: column; }
            .sidebar {
                width: 100%; min-width: 0;
                max-height: 40vh;
                padding: 14px 16px;
                border-right: none;
                border-bottom: 1px solid #1e3050;
            }
            .map-container { min-height: 60vh; flex: 1; }
            .sidebar h2 { font-size: 1.15em; }
            .subtitle { margin-bottom: 10px; font-size: 0.82em; }

            /* Sim cards - larger touch targets */
            .sim-type-cards { gap: 8px; margin-bottom: 12px; }
            .sim-card {
                padding: 12px 8px;
                border-radius: 10px;
            }
            .sim-card .sim-icon { font-size: 1.6em; margin-bottom: 2px; }
            .sim-card .sim-label { font-size: 0.82em; }

            /* Form - larger inputs for touch */
            input, select {
                padding: 10px 12px;
                font-size: 16px;
                margin-bottom: 8px;
                border-radius: 8px;
            }
            label { font-size: 0.85em; margin-bottom: 4px; }
            .form-section { margin-bottom: 10px; }
            .param-group { padding: 12px; border-radius: 8px; }
            .row { gap: 8px; }

            /* Submit button - larger touch target */
            .submit-btn {
                padding: 14px;
                font-size: 16px;
                border-radius: 8px;
            }

            /* Map overlay - compact */
            .map-overlay {
                top: 8px; right: 8px;
                padding: 6px 10px;
                font-size: 0.78em;
                border-radius: 6px;
            }
        }

        /* Small phones */
        @media (max-width: 380px) {
            .sidebar { padding: 10px 12px; max-height: 38vh; }
            .sim-card .sim-icon { font-size: 1.4em; }
            .sim-card .sim-label { font-size: 0.75em; }
            .sidebar h2 { font-size: 1.05em; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <h2>SeaCurrent Drift Simulator</h2>
            <p class="subtitle">
                OpenDrift ocean drift simulation
                &nbsp;|&nbsp; <a href="forecast.html">Forecast Map &rarr;</a>
            </p>

            <div class="sim-type-cards">
                <button type="button" class="sim-card active" data-type="leeway" onclick="setSimType('leeway')">
                    <span class="sim-icon">&#x1F6DF;</span>
                    <span class="sim-label">Person</span>
                </button>
                <button type="button" class="sim-card" data-type="oceandrift" onclick="setSimType('oceandrift')">
                    <span class="sim-icon">&#x1F30A;</span>
                    <span class="sim-label">Debris</span>
                </button>
                <button type="button" class="sim-card" data-type="openoil" onclick="setSimType('openoil')">
                    <span class="sim-icon">&#x1F6E2;</span>
                    <span class="sim-label">Oil Spill</span>
                </button>
            </div>

            <form id="simulationForm">
                <div class="row">
                    <div>
                        <label for="lon">Longitude</label>
                        <input type="number" step="any" id="lon" value="121.5" required>
                    </div>
                    <div>
                        <label for="lat">Latitude</label>
                        <input type="number" step="any" id="lat" value="24.0" required>
                    </div>
                </div>
                <p class="map-hint">Click the map to set coordinates</p>

                <div class="form-section">
                    <label for="duration">Duration (hours)</label>
                    <input type="number" id="duration" value="24" min="1" max="84">
                </div>

                <!-- Leeway params -->
                <div id="leewayParams" class="model-params visible">
                    <div class="param-group">
                        <label for="objectType">Object Type</label>
                        <select id="objectType">
                            <option value="26" selected>Life raft, no ballast</option>
                            <option value="1">Person in water (PIW)</option>
                            <option value="4">Person in water, vertical</option>
                            <option value="14">Life raft, ballast, canopy</option>
                            <option value="27">Life raft, ballast, no canopy</option>
                            <option value="40">Life raft, capsized</option>
                            <option value="52">Fishing vessel</option>
                            <option value="56">Sailboat, monohull</option>
                            <option value="63">Skiff, flat bottom</option>
                            <option value="72">Surfboard</option>
                        </select>
                    </div>
                </div>
                <!-- OceanDrift params -->
                <div id="oceandriftParams" class="model-params">
                    <div class="param-group">
                        <label for="windDriftFactor">Wind Drift Factor</label>
                        <input type="number" step="0.001" id="windDriftFactor" value="0.02" min="0" max="0.1">
                    </div>
                </div>
                <!-- OpenOil params -->
                <div id="openoilParams" class="model-params">
                    <div class="param-group">
                        <label for="oilType">Oil Type</label>
                        <select id="oilType">
                            <option value="GENERIC MEDIUM CRUDE" selected>Medium Crude</option>
                            <option value="GENERIC HEAVY CRUDE">Heavy Crude</option>
                            <option value="GENERIC LIGHT CRUDE">Light Crude</option>
                            <option value="GENERIC DIESEL">Diesel</option>
                            <option value="GENERIC BUNKER C">Bunker C</option>
                        </select>
                        <label for="oilAmount">Amount (m&sup3;)</label>
                        <input type="number" step="1" id="oilAmount" value="100" min="1" max="10000">
                    </div>
                </div>

                <div class="form-section">
                    <label for="email">Email (results sent here)</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Submit Simulation</button>
            </form>

            <div id="success"></div>
            <div id="error"></div>
            <div id="logs"></div>
        </div>

        <div class="map-container">
            <div id="map"></div>
            <div class="map-overlay">
                <div>Cursor: <span class="coord-display" id="cursorCoords">--</span></div>
            </div>
        </div>
    </div>

<script>
// --- Map ---
var map = L.map('map', { zoomControl: false }).setView([23.5, 121], 7);
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 18,
}).addTo(map);

var seedMarker = null;
var trajectoryLayer = L.layerGroup().addTo(map);

// Click to set coordinates
map.on('click', function(e) {
    document.getElementById('lon').value = e.latlng.lng.toFixed(4);
    document.getElementById('lat').value = e.latlng.lat.toFixed(4);
    updateSeedMarker(e.latlng.lat, e.latlng.lng);
});

map.on('mousemove', function(e) {
    document.getElementById('cursorCoords').textContent =
        e.latlng.lat.toFixed(4) + ', ' + e.latlng.lng.toFixed(4);
});

function updateSeedMarker(lat, lng) {
    if (seedMarker) map.removeLayer(seedMarker);
    seedMarker = L.circleMarker([lat, lng], {
        radius: 8, color: '#ff4444', fillColor: '#ff4444', fillOpacity: 0.8, weight: 2,
    }).addTo(map).bindPopup('Seed: ' + lat.toFixed(4) + ', ' + lng.toFixed(4));
}

// Init marker
updateSeedMarker(24.0, 121.5);

// Update marker when inputs change
['lon', 'lat'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', function() {
        var lat = parseFloat(document.getElementById('lat').value);
        var lng = parseFloat(document.getElementById('lon').value);
        if (!isNaN(lat) && !isNaN(lng)) updateSeedMarker(lat, lng);
    });
});

// --- Simulation type ---
var currentSimType = 'leeway';
var MODEL_CONFIG = {
    leeway:     { paramsId: 'leewayParams' },
    oceandrift: { paramsId: 'oceandriftParams' },
    openoil:    { paramsId: 'openoilParams' },
};

function setSimType(type) {
    currentSimType = type;
    document.querySelectorAll('.sim-card').forEach(function(c) {
        c.classList.toggle('active', c.dataset.type === type);
    });
    document.querySelectorAll('.model-params').forEach(function(el) { el.classList.remove('visible'); });
    document.getElementById(MODEL_CONFIG[type].paramsId).classList.add('visible');
}

function getModelParams() {
    if (currentSimType === 'leeway') return { object_type: document.getElementById('objectType').value };
    if (currentSimType === 'oceandrift') return { wind_drift_factor: document.getElementById('windDriftFactor').value };
    if (currentSimType === 'openoil') return { oil_type: document.getElementById('oilType').value, amount: document.getElementById('oilAmount').value };
    return {};
}

// --- Submit ---
var VERCEL_API_URL = 'https://seacurrent.vercel.app/api/simulate';

document.getElementById('simulationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var successEl = document.getElementById('success');
    var errorEl = document.getElementById('error');
    successEl.textContent = '';
    errorEl.textContent = '';

    var payload = Object.assign({
        lon: parseFloat(document.getElementById('lon').value),
        lat: parseFloat(document.getElementById('lat').value),
        duration: parseInt(document.getElementById('duration').value),
        email: document.getElementById('email').value.trim(),
        model_type: currentSimType,
    }, getModelParams());

    if (!payload.email) { errorEl.textContent = 'Please enter your email.'; return; }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
        var resp = await fetch(VERCEL_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        var data = await resp.json();
        if (data.status === 'queued') {
            successEl.textContent = 'Simulation queued (ID: ' + data.request_id + '). Results will be emailed to ' + payload.email;
        } else {
            errorEl.textContent = 'Error: ' + (data.error || 'Unknown error');
        }
    } catch (err) {
        errorEl.textContent = 'Request failed: ' + err.message;
    }
    btn.disabled = false;
    btn.textContent = 'Submit Simulation';
});
</script>
</body>
</html>
