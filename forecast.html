<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1628">
    <title>SeaCurrent - Drift Forecast</title>
    <link rel="stylesheet" href="colors_and_type.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: clamp(14px, 0.45vw + 11px, 20px); }
        body {
            font-family: var(--font-sans);
            background: var(--bg-0);
            color: var(--fg-1);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top bar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .topbar h2 { font-size: 1.35em; color: var(--fg-0); }
        .topbar .meta { font-size: 0.9em; color: var(--fg-3); }
        .topbar .meta span { color: var(--accent); font-weight: 600; }
        .topbar a { color: var(--accent); text-decoration: none; font-size: 0.95em; }
        .topbar a:hover { text-decoration: underline; }

        /* Main layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar point list */
        .point-list {
            width: 280px;
            min-width: 280px;
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 10px;
        }
        .point-item {
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: background 0.15s;
            border: 2px solid transparent;
        }
        .point-item:hover { background: var(--bg-3); }
        .point-item.active { background: var(--bg-elevated); border-color: var(--accent); }
        .point-item .name-zh { font-weight: 600; font-size: 1.05em; }
        .point-item .name-en { color: var(--fg-3); font-size: 0.88em; }
        .point-item .coords { color: var(--fg-4); font-size: 0.82em; margin-top: 3px; }
        .point-item .status-ok { color: var(--success); font-size: 0.82em; margin-top: 3px; }
        .point-item .status-err { color: var(--error); font-size: 0.82em; margin-top: 3px; }
        .point-item .thumb {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid var(--border);
            background: var(--bg-2);
        }
        .point-item .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Map area */
        .map-area { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* Layer toggle controls */
        .layer-controls {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .layer-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 14px;
            background: rgba(16, 29, 51, 0.92);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--fg-3);
            font-size: 0.92em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
        }
        .layer-btn:hover { background: rgba(26, 53, 88, 0.95); color: var(--fg-1); }
        .layer-btn.active { background: rgba(26, 53, 88, 0.95); color: var(--fg-0); border-color: var(--accent); }
        .layer-btn .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .layer-group {
            background: rgba(16, 29, 51, 0.92);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            backdrop-filter: blur(8px);
            min-width: 180px;
        }
        .layer-group-title {
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--fg-3);
            margin-bottom: 4px;
        }
        .layer-select {
            width: 100%;
            background: rgba(10, 18, 32, 0.9);
            color: var(--fg-1);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            font-family: inherit;
            font-size: 0.9em;
            cursor: pointer;
        }
        .layer-select:focus { outline: none; border-color: var(--accent); }

        /* Scalar overlay color bar (temperature / humidity) */
        .scalar-bar {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: rgba(16, 29, 51, 0.92);
            padding: 10px 14px;
            border-radius: 8px;
            z-index: 1000;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            min-width: 220px;
            font-size: 0.85em;
            color: var(--fg-1);
            display: none;
        }
        .scalar-bar-title { font-weight: 600; margin-bottom: 6px; color: var(--fg-0); }
        .scalar-gradient {
            height: 10px;
            width: 100%;
            border-radius: 3px;
            margin-bottom: 4px;
        }
        .scalar-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.82em;
            color: var(--fg-2);
        }

        /* Legend overlay */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(16, 29, 51, 0.92);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.92em;
            z-index: 1000;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        .legend-title { font-weight: 600; margin-bottom: 6px; color: var(--fg-0); }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; color: var(--fg-2); }
        .legend-color {
            width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
        }
        .legend-line {
            width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0;
        }

        /* Velocity color bar */
        .velocity-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(16, 29, 51, 0.92);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88em;
            z-index: 1000;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            display: none;
        }
        .velocity-bar-title { color: var(--fg-0); font-weight: 600; margin-bottom: 6px; font-size: 1em; }
        .velocity-gradient {
            width: 12rem;
            height: 0.85rem;
            border-radius: 3px;
            margin-bottom: 4px;
        }
        .velocity-labels {
            display: flex;
            justify-content: space-between;
            color: var(--fg-3);
            font-size: 0.9em;
        }

        /* Info panel */
        .info-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(16, 29, 51, 0.92);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.95em;
            z-index: 1000;
            border: 1px solid var(--border);
            max-width: 340px;
            backdrop-filter: blur(8px);
            display: none;
        }
        .info-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .info-panel h4 { color: var(--fg-0); font-size: 1.05em; }
        .info-panel-toggle {
            background: rgba(26, 53, 88, 0.6);
            border: 1px solid var(--border-strong);
            color: var(--fg-1);
            width: 28px; height: 28px;
            border-radius: 6px;
            font-size: 1em;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
            font-family: inherit;
            padding: 0;
        }
        .info-panel-toggle:hover { background: rgba(26, 53, 88, 0.95); }
        .info-panel .info-row { color: var(--fg-3); margin-bottom: 4px; }
        .info-panel .info-row span { color: var(--fg-1); font-weight: 600; }
        .info-panel.collapsed .info-row,
        .info-panel.collapsed .sim-image-wrap { display: none; }
        .info-panel.collapsed .info-panel-header { margin-bottom: 0; }
        .info-panel .sim-image-wrap {
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: zoom-in;
            aspect-ratio: 4 / 3;
            background: var(--bg-2);
            transition: max-height 0.25s ease, aspect-ratio 0.25s ease;
        }
        .info-panel .sim-image-wrap.shrunk {
            aspect-ratio: auto;
            max-height: 44px;
        }
        .info-panel .sim-image-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-panel .sim-image-wrap.shrunk img { object-position: center 30%; }

        /* Simulation image lightbox */
        .sim-lightbox {
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 20, 0.92);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(6px);
        }
        .sim-lightbox.open { display: flex; }
        .sim-lightbox img {
            max-width: 95vw;
            max-height: 90vh;
            max-height: 90dvh;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .sim-lightbox-close {
            position: absolute;
            top: 18px;
            right: 22px;
            color: var(--fg-0);
            background: rgba(16, 29, 51, 0.8);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.4em;
            cursor: pointer;
            line-height: 1;
        }

        .loading-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--fg-3);
            font-size: 1.1em;
            z-index: 1000;
        }

        /* Timeline scrubber */
        .timeline {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(16, 29, 51, 0.95);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            z-index: 1000;
            width: min(calc(100% - 380px), 720px);
        }
        .tl-btn {
            background: var(--bg-elevated);
            color: var(--fg-1);
            border: 1px solid var(--border-strong);
            border-radius: 50%;
            width: 2rem; height: 2rem;
            cursor: pointer;
            font-size: 0.85em;
            line-height: 1;
            flex-shrink: 0;
            font-family: inherit;
        }
        .tl-btn:hover { background: var(--border-strong); }
        .tl-btn.playing { background: var(--accent-strong); border-color: var(--accent-strong); }
        .tl-info { display: flex; flex-direction: column; line-height: 1.15; flex-shrink: 0; min-width: 6rem; }
        .tl-label { color: var(--accent); font-weight: 700; font-size: 0.95em; }
        .tl-time { color: var(--fg-3); font-size: 0.8em; }
        .tl-range { flex: 1; accent-color: var(--accent); cursor: pointer; min-width: 0; }
        .tl-loading { color: var(--warn); font-size: 1em; flex-shrink: 0; width: 1em; text-align: center; }

        /* Windy-style forecast strip */
        .forecast-strip {
            position: absolute;
            left: 50%;
            top: 14px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 6px;
            background: rgba(16, 29, 51, 0.92);
            border: 1px solid var(--border);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            z-index: 1000;
            max-width: min(calc(100% - 380px), 820px);
            overflow-x: auto;
            scrollbar-width: thin;
        }
        .strip-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px 5px 5px;
            border-radius: 7px;
            border: 2px solid transparent;
            background: var(--bg-3);
            color: var(--fg-1);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            text-align: left;
        }
        .strip-card:hover { background: var(--bg-elevated); border-color: var(--border-hover); }
        .strip-card.active { border-color: var(--accent); background: var(--bg-elevated); color: var(--fg-0); }
        .strip-card .strip-thumb {
            width: 2.4rem;
            height: 2.4rem;
            background: var(--bg-2);
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .strip-card .strip-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .strip-card .strip-name { font-size: 0.88em; font-weight: 600; white-space: nowrap; }

        /* Responsive - Mobile */
        @media (max-width: 700px) {
            .topbar {
                flex-direction: row;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
            }
            .topbar h2 { font-size: 0.98em; line-height: 1.2; }
            .topbar a { font-size: 0.78em; flex-shrink: 0; }
            .topbar .meta { font-size: 0.72em; line-height: 1.35; color: var(--fg-2); }

            .main { flex-direction: column; }

            /* Point list: horizontal scroll, compact chips, no thumbs */
            .point-list {
                width: 100%; min-width: 0;
                max-height: none;
                display: flex; gap: 6px;
                overflow-x: auto; overflow-y: hidden;
                padding: 6px 10px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                scroll-snap-type: x mandatory;
                flex-shrink: 0;
            }
            .point-list::-webkit-scrollbar { display: none; }
            .point-item {
                min-width: auto;
                max-width: none;
                margin-bottom: 0;
                padding: 7px 11px;
                flex-shrink: 0;
                scroll-snap-align: start;
                border-width: 1px;
                border-radius: 999px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .point-item .name-zh { font-size: 0.88em; font-weight: 600; line-height: 1.15; }
            .point-item .name-en,
            .point-item .coords,
            .point-item .status-ok,
            .point-item .status-err { display: none; }
            /* Image belongs to the info-panel only on mobile; hide card thumb
               in every state so the chip stays compact. */
            .point-item .thumb,
            .point-item.active .thumb { display: none; }

            .map-area { flex: 1; min-height: 0; }

            /* Layer controls - compact pill row; dropdowns become inline */
            .layer-controls {
                top: 8px; left: 8px; right: 8px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
            }
            .layer-group {
                padding: 5px 8px;
                min-width: 0;
                flex: 1 1 calc(50% - 3px);
                max-width: calc(50% - 3px);
            }
            .layer-group-title {
                font-size: 0.6em;
                margin-bottom: 2px;
                letter-spacing: 0.06em;
            }
            /* 16px prevents iOS focus-zoom */
            .layer-select {
                padding: 6px 8px;
                font-size: 16px;
            }
            .layer-btn {
                padding: 6px 10px;
                font-size: 0.75em;
                border-radius: 6px;
            }

            /* Info panel: compact bottom sheet above the timeline */
            .info-panel {
                top: auto;
                bottom: calc(64px + env(safe-area-inset-bottom));
                right: 8px;
                left: 8px;
                max-width: none;
                font-size: 0.8em;
                padding: 10px 12px;
                max-height: 52dvh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .info-panel h4 { font-size: 0.95em; margin-bottom: 4px; }
            .info-panel .info-row { margin-bottom: 2px; font-size: 0.9em; }
            .info-panel .sim-image-wrap {
                margin-top: 8px;
                aspect-ratio: 16 / 11;
            }

            /* Legend is small and optional on mobile; hide it so it doesn't
               fight the timeline / velocity bar at the bottom of the map */
            .legend { display: none; }

            /* Velocity bar sits just above the timeline, safe-area aware */
            .velocity-bar {
                bottom: calc(60px + env(safe-area-inset-bottom));
                right: 10px;
                padding: 6px 10px;
                font-size: 0.75em;
            }
            .velocity-bar-title { font-size: 0.9em; margin-bottom: 3px; }
            .velocity-gradient { width: 100px; height: 8px; }

            .scalar-bar {
                bottom: calc(64px + env(safe-area-inset-bottom));
                right: 8px;
                left: 8px;
                padding: 8px 12px;
                min-width: 0;
                font-size: 0.78em;
            }

            /* Hide strip on mobile (sidebar list serves same purpose) */
            .forecast-strip { display: none; }

            /* Timeline - full width on mobile, hugging bottom safe area */
            .timeline {
                width: calc(100% - 16px);
                left: 8px;
                right: 8px;
                transform: none;
                bottom: max(8px, env(safe-area-inset-bottom, 8px));
                padding: 7px 10px;
                gap: 8px;
                border-radius: 12px;
            }
            .tl-btn { width: 1.8rem; height: 1.8rem; font-size: 0.8em; }
            .tl-info { min-width: 4.2rem; }
            .tl-label { font-size: 0.82em; }
            .tl-time { font-size: 0.68em; }

            /* Attribution collides with full-width timeline on phones */
            .leaflet-control-attribution { display: none; }
        }

        @media (max-width: 380px) {
            .topbar { padding: 6px 10px; gap: 6px; }
            .topbar h2 { font-size: 0.88em; }
            .topbar a { font-size: 0.72em; }
            .point-list { padding: 5px 8px; gap: 5px; }
            .point-item { padding: 6px 9px; }
            .point-item .name-zh { font-size: 0.82em; }
            .layer-btn { padding: 5px 8px; font-size: 0.7em; }
            /* Keep 16px so iOS doesn't zoom in when the select is focused */
            .layer-select { font-size: 16px; padding: 5px 6px; }
            .info-panel { font-size: 0.75em; padding: 8px 10px; }
        }

        /* ── Embed mode (used when this page is loaded in an iframe from
              index.html's hero visual). Strip most chrome but keep the
              layer selectors so visitors can explore. ── */
        body.embed-mode .topbar,
        body.embed-mode .point-list,
        body.embed-mode .forecast-strip,
        body.embed-mode .timeline,
        body.embed-mode .info-panel,
        body.embed-mode .legend,
        body.embed-mode .loading-msg,
        body.embed-mode .sim-lightbox { display: none !important; }
        body.embed-mode .main { flex: 1; }
        body.embed-mode .map-area { width: 100%; }
        /* Shrink the layer selectors so they don't dominate the small
           hero preview, and nudge them in from the edge. */
        body.embed-mode .layer-controls {
            top: 8px;
            left: 8px;
            gap: 3px;
        }
        body.embed-mode .layer-group-title { font-size: 0.62em; }
        body.embed-mode .layer-select {
            font-size: 0.75em;
            padding: 3px 6px;
            max-width: 9rem;
        }
        body.embed-mode .velocity-bar,
        body.embed-mode .scalar-bar {
            font-size: 0.7em;
            padding: 6px 8px;
        }
        body.embed-mode .leaflet-control-attribution { font-size: 9px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div>
            <h2>Taiwan Waters Drift Forecast</h2>
            <div class="meta" id="metaInfo"></div>
        </div>
        <div>
            <a href="index.html">&larr; Custom Simulation</a>
            &nbsp;|&nbsp;
            <a href="tide.html">Tide &rarr;</a>
        </div>
    </div>

    <div class="main">
        <div class="point-list" id="pointList">
            <div style="padding:20px;color:var(--fg-3);text-align:center;">Loading...</div>
        </div>
        <div class="map-area">
            <div id="map"></div>
            <div class="loading-msg" id="loadingMsg">Loading forecast data...</div>

            <!-- Layer toggle controls -->
            <div class="layer-controls">
                <div class="layer-group">
                    <div class="layer-group-title">Vector flow</div>
                    <select id="vectorLayerSel" class="layer-select" onchange="selectVectorLayer(this.value)">
                        <option value="current">Ocean current</option>
                        <option value="wind">Wind (surface)</option>
                        <option value="wind_10m">Wind 10 m (GFS)</option>
                        <option value="wind_850hPa">Wind 850 hPa</option>
                        <option value="wind_925hPa">Wind 925 hPa</option>
                        <option value="wind_1000hPa">Wind 1000 hPa</option>
                    </select>
                </div>
                <div class="layer-group">
                    <div class="layer-group-title">Overlay</div>
                    <select id="scalarLayerSel" class="layer-select" onchange="selectScalarOverlay(this.value)">
                        <option value="">None</option>
                        <option value="temp_2m">Temperature 2 m</option>
                        <option value="temp_850hPa">Temperature 850 hPa</option>
                        <option value="temp_925hPa">Temperature 925 hPa</option>
                        <option value="temp_1000hPa">Temperature 1000 hPa</option>
                        <option value="rh_2m">Humidity 2 m</option>
                        <option value="rh_850hPa">Humidity 850 hPa</option>
                        <option value="rh_925hPa">Humidity 925 hPa</option>
                        <option value="rh_1000hPa">Humidity 1000 hPa</option>
                    </select>
                </div>
            </div>

            <!-- Scalar overlay color bar -->
            <div class="scalar-bar" id="scalarBar">
                <div class="scalar-bar-title" id="scalarBarTitle"></div>
                <div class="scalar-gradient" id="scalarGradient"></div>
                <div class="scalar-labels">
                    <span id="scalarMin"></span>
                    <span id="scalarMid"></span>
                    <span id="scalarMax"></span>
                </div>
            </div>

            <div class="legend" id="legend" style="display:none;">
                <div class="legend-title">Drift Forecast</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff4444;border-radius:50%;"></div> Start point</div>
                <div class="legend-item"><div class="legend-line" style="background:#4a9eff;"></div> Trajectories</div>
                <div class="legend-item"><div class="legend-color" style="background:rgba(255,165,0,0.3);border:1px solid orange;"></div> Spread area</div>
                <div class="legend-item"><div class="legend-color" style="background:#34d399;border-radius:50%;"></div> End center</div>
            </div>

            <!-- Velocity color bar -->
            <div class="velocity-bar" id="velocityBar">
                <div class="velocity-bar-title" id="velocityBarTitle">Ocean Current (m/s)</div>
                <div class="velocity-gradient" id="velocityGradient"></div>
                <div class="velocity-labels">
                    <span>0</span>
                    <span id="velocityMid">0.75</span>
                    <span id="velocityMax">1.5</span>
                </div>
            </div>

            <!-- Forecast point strip (Windy-style picker) -->
            <div class="forecast-strip" id="forecastStrip"></div>

            <!-- Timeline scrubber -->
            <div class="timeline" id="timeline" style="display:none;">
                <button type="button" class="tl-btn" id="tlPlay" aria-label="Play">&#9654;</button>
                <div class="tl-info">
                    <span class="tl-label" id="tlLabel">T+0h</span>
                    <span class="tl-time" id="tlTime"></span>
                </div>
                <input type="range" id="tlSlider" min="0" max="72" value="0" step="1" class="tl-range">
                <span class="tl-loading" id="tlLoading" style="display:none;">…</span>
            </div>

            <div class="info-panel" id="infoPanel">
                <div class="info-panel-header">
                    <h4 id="infoPanelTitle"></h4>
                    <button type="button" class="info-panel-toggle" id="infoPanelToggle"
                        aria-label="Collapse panel" title="Collapse / expand">&#x2212;</button>
                </div>
                <div class="info-row">Location: <span id="infoPanelCoords"></span></div>
                <div class="info-row">Particles: <span id="infoPanelParticles"></span></div>
                <div class="info-row">Duration: <span id="infoPanelDuration"></span></div>
                <div class="sim-image-wrap" id="infoPanelImageWrap" style="display:none;">
                    <img id="infoPanelImage" alt="Simulation preview">
                </div>
            </div>
        </div>
    </div>

    <div class="sim-lightbox" id="simLightbox">
        <button type="button" class="sim-lightbox-close" id="simLightboxClose" aria-label="Close">&times;</button>
        <img id="simLightboxImg" alt="Simulation">
    </div>

<script>
var MANIFEST_URL = 'scheduled_results/manifest.json';
var CURRENT_VELOCITY_URL = 'scheduled_results/current_velocity.json';
var WIND_VELOCITY_URL = 'scheduled_results/wind_velocity.json';

// Embed mode: loaded in an iframe (hero visual on index.html). Hide all
// chrome via the CSS class, lock map interactions, and auto-cycle layers.
var EMBED_MODE = /[?&]embed=1\b/.test(window.location.search);
if (EMBED_MODE) document.body.classList.add('embed-mode');

var mapOptions = { zoomControl: false };
if (EMBED_MODE) {
    mapOptions.dragging = false;
    mapOptions.scrollWheelZoom = false;
    mapOptions.doubleClickZoom = false;
    mapOptions.touchZoom = false;
    mapOptions.boxZoom = false;
    mapOptions.keyboard = false;
    mapOptions.tap = false;
    mapOptions.attributionControl = false;
}
var map = L.map('map', mapOptions).setView([23.5, 121], 7);
// Zoom control: bottom-right on desktop, hidden on narrow phones where it
// would collide with the velocity bar + timeline. Pinch-to-zoom still works.
var IS_PHONE = window.matchMedia('(max-width: 700px)').matches;
if (!IS_PHONE && !EMBED_MODE) {
    L.control.zoom({ position: 'bottomright' }).addTo(map);
}

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO',
    maxZoom: 18,
}).addTo(map);

var trajectoryLayer = L.layerGroup().addTo(map);
var pointMarkers = {};
var pointData = {};
var activePointId = null;

// Velocity layers
var currentVelocityLayer = null;
var windVelocityLayer = null;
var activeVelocityLayer = 'current';

// GFS multi-level vector layers (per layer id → L.velocityLayer instance)
var gfsVectorLayers = {};
// Active scalar overlay state
var activeScalarLayer = '';       // layer id from index.layers, '' = none
var scalarOverlayImage = null;    // current L.imageOverlay on the map
var scalarFrameCache = {};        // name+hour → raw JSON
var gfsLayerMeta = {};            // layer id → {type, base_time, hours, step, units, level}

var COLORS = ['#4a9eff', '#34d399', '#f59e0b', '#a78bfa', '#f87171'];

// ── Velocity layer loading ──

function loadVelocityLayer(url, type) {
    return fetch(url + '?t=' + Date.now())
        .then(function(r) {
            if (!r.ok) throw new Error(type + ' data not available');
            return r.json();
        })
        .then(function(data) {
            var isCurrent = type === 'current';
            var layer = L.velocityLayer({
                displayValues: true,
                displayOptions: {
                    velocityType: isCurrent ? 'Ocean Current' : 'Wind',
                    displayPosition: 'bottomleft',
                    displayEmptyString: 'No data',
                    speedUnit: 'm/s',
                    angleConvention: 'bearingCW',
                },
                data: data,
                maxVelocity: isCurrent ? 1.5 : 15,
                velocityScale: isCurrent ? 0.01 : 0.005,
                particleAge: 60,
                lineWidth: isCurrent ? 2 : 1.5,
                particleMultiplier: 1 / 200,
                colorScale: isCurrent
                    ? ["#1a237e","#1565c0","#42a5f5","#29b6f6","#26c6da","#00e5ff","#76ff03","#ffeb3b","#ff9800","#f44336"]
                    : ["#364fc7","#4c6ef5","#748ffc","#91a7ff","#bac8ff","#dbe4ff","#f8f9fa","#ffe8cc","#ffc078","#ff922b"],
                frameRate: 30,
                opacity: 0.92,
            });

            if (isCurrent) {
                currentVelocityLayer = layer;
            } else {
                windVelocityLayer = layer;
            }
            return layer;
        })
        .catch(function(err) {
            console.warn('Failed to load ' + type + ' velocity:', err.message);
            return null;
        });
}

function isGfsVector(type) { return type && type.indexOf('wind_') === 0; }

function removeAllVectorLayers() {
    if (currentVelocityLayer && map.hasLayer(currentVelocityLayer)) map.removeLayer(currentVelocityLayer);
    if (windVelocityLayer && map.hasLayer(windVelocityLayer)) map.removeLayer(windVelocityLayer);
    Object.keys(gfsVectorLayers).forEach(function(k) {
        var l = gfsVectorLayers[k];
        if (l && map.hasLayer(l)) map.removeLayer(l);
    });
}

function selectVectorLayer(type) {
    activeVelocityLayer = type;
    removeAllVectorLayers();

    if (type === 'current') {
        if (currentVelocityLayer) map.addLayer(currentVelocityLayer);
        updateVelocityBar('Ocean Current (m/s)', 1.5, 'current');
    } else if (type === 'wind') {
        if (windVelocityLayer) map.addLayer(windVelocityLayer);
        updateVelocityBar('Wind (m/s)', 15, 'wind');
    } else if (isGfsVector(type)) {
        updateVelocityBar(vectorLabel(type) + ' (m/s)', 30, 'wind');
        // Lazy-build on demand; the timeline refresh below will fetch the frame.
    }

    if (framesIndex) setForecastHour(currentFrameHour);
}

function vectorLabel(type) {
    if (type === 'wind_10m') return 'Wind 10 m (GFS)';
    if (type === 'wind_850hPa') return 'Wind 850 hPa';
    if (type === 'wind_925hPa') return 'Wind 925 hPa';
    if (type === 'wind_1000hPa') return 'Wind 1000 hPa';
    return type;
}

function selectScalarOverlay(name) {
    activeScalarLayer = name || '';
    if (scalarOverlayImage && map.hasLayer(scalarOverlayImage)) {
        map.removeLayer(scalarOverlayImage);
    }
    scalarOverlayImage = null;

    var bar = document.getElementById('scalarBar');
    if (!activeScalarLayer) {
        bar.style.display = 'none';
        return;
    }
    bar.style.display = 'block';
    // Seed the color bar with the unit + placeholder range; renderScalarOverlay
    // will replace it with per-frame p5/p95 once the first frame arrives.
    var info = SCALAR_UNITS[scalarKind(activeScalarLayer)];
    document.getElementById('scalarBarTitle').textContent = scalarLabel(activeScalarLayer) + ' (loading…)';
    document.getElementById('scalarGradient').style.background = SCALAR_GRADIENTS[scalarKind(activeScalarLayer)];
    document.getElementById('scalarMin').textContent = '';
    document.getElementById('scalarMid').textContent = '';
    document.getElementById('scalarMax').textContent = info.unit;
    if (framesIndex) setForecastHour(currentFrameHour);
}

function updateVelocityBar(title, maxVal, type) {
    var bar = document.getElementById('velocityBar');
    bar.style.display = 'block';
    document.getElementById('velocityBarTitle').textContent = title;
    document.getElementById('velocityMax').textContent = maxVal;
    document.getElementById('velocityMid').textContent = (maxVal / 2);

    var gradient = type === 'current'
        ? 'linear-gradient(to right, #1a237e, #1565c0, #42a5f5, #26c6da, #00e5ff, #76ff03, #ffeb3b, #ff9800, #f44336)'
        : 'linear-gradient(to right, #364fc7, #4c6ef5, #91a7ff, #dbe4ff, #f8f9fa, #ffe8cc, #ffc078, #ff922b)';
    document.getElementById('velocityGradient').style.background = gradient;
}

// ── Scalar overlay (temperature / humidity) ──

// Display units only — the actual min/max is computed per-frame so color
// contrast adapts to the region instead of wasting most of the gradient
// on temperatures that never occur in Taiwan.
var SCALAR_UNITS = {
    temp: { unit: '°C', offsetK: -273.15 },
    rh:   { unit: '%',  offsetK: 0 },
};
var SCALAR_GRADIENTS = {
    temp: 'linear-gradient(to right, #3b4cca, #4a9eff, #26c6da, #76ff03, #ffeb3b, #ff9800, #f44336)',
    rh:   'linear-gradient(to right, #fff3bf, #d0ebff, #74c0fc, #339af0, #1864ab)',
};

function scalarKind(name) {
    return name.indexOf('temp_') === 0 ? 'temp' : 'rh';
}

// Current scalar render range (updated per-frame by renderScalarOverlay).
var scalarActiveRange = { min: 0, max: 1, unit: '' };

function updateScalarBar(name, rangeOverride) {
    var kind = scalarKind(name);
    var info = SCALAR_UNITS[kind];
    var r = rangeOverride || scalarActiveRange;
    var digits = (Math.abs(r.max - r.min) >= 20) ? 0 : 1;
    document.getElementById('scalarBarTitle').textContent = scalarLabel(name);
    document.getElementById('scalarMin').textContent = r.min.toFixed(digits) + ' ' + info.unit;
    document.getElementById('scalarMid').textContent = ((r.min + r.max) / 2).toFixed(digits) + ' ' + info.unit;
    document.getElementById('scalarMax').textContent = r.max.toFixed(digits) + ' ' + info.unit;
    document.getElementById('scalarGradient').style.background = SCALAR_GRADIENTS[kind];
}

function scalarLabel(name) {
    if (name === 'temp_2m') return 'Temperature 2 m';
    if (name === 'rh_2m') return 'Humidity 2 m';
    var m = name.match(/^(temp|rh)_(\d+)hPa$/);
    if (m) return (m[1] === 'temp' ? 'Temperature ' : 'Humidity ') + m[2] + ' hPa';
    return name;
}

// Linear interpolation between color stops (hex strings).
function interpColor(stops, t) {
    if (t <= 0) return stops[0];
    if (t >= 1) return stops[stops.length - 1];
    var seg = t * (stops.length - 1);
    var i = Math.floor(seg);
    var frac = seg - i;
    var c1 = hexToRgb(stops[i]);
    var c2 = hexToRgb(stops[i + 1]);
    return [
        Math.round(c1[0] + (c2[0] - c1[0]) * frac),
        Math.round(c1[1] + (c2[1] - c1[1]) * frac),
        Math.round(c1[2] + (c2[2] - c1[2]) * frac),
    ];
}
function hexToRgb(h) {
    h = h.replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
var SCALAR_STOPS = {
    temp: ['#3b4cca', '#4a9eff', '#26c6da', '#76ff03', '#ffeb3b', '#ff9800', '#f44336'],
    rh:   ['#fff3bf', '#d0ebff', '#74c0fc', '#339af0', '#1864ab'],
};

// Percentile of a numeric array (0..1). Uses a copy-sort; the grids here are
// small (36×26 ≈ 936 samples) so this is cheap per frame.
function percentile(arr, p) {
    var sorted = arr.slice().sort(function(a, b) { return a - b; });
    var idx = Math.max(0, Math.min(sorted.length - 1, Math.round(p * (sorted.length - 1))));
    return sorted[idx];
}

// Round a number to a "nice" scale boundary so the color bar shows 10, 15,
// 20 rather than 13.7, 17.2, 20.6.
function niceRound(v, direction) {
    if (!isFinite(v)) return v;
    var step = Math.abs(v) >= 50 ? 5 : (Math.abs(v) >= 10 ? 1 : 0.5);
    return direction === 'down' ? Math.floor(v / step) * step : Math.ceil(v / step) * step;
}

// Render a scalar JSON component as a colorized Leaflet image overlay.
function renderScalarOverlay(data, layerName) {
    if (!data || !data[0] || !data[0].header) return;
    var comp = data[0];
    var h = comp.header;
    var nx = h.nx, ny = h.ny;
    var values = comp.data;
    var kind = scalarKind(layerName);
    var info = SCALAR_UNITS[kind];
    var stops = SCALAR_STOPS[kind];

    // Auto-scale the color range from this frame's data distribution. p5/p95
    // keeps outliers from stretching the scale while still covering almost
    // all pixels with meaningful color gradient.
    var displayVals = new Array(values.length);
    for (var k = 0; k < values.length; k++) displayVals[k] = values[k] + info.offsetK;
    var lo = niceRound(percentile(displayVals, 0.05), 'down');
    var hi = niceRound(percentile(displayVals, 0.95), 'up');
    if (hi - lo < 1) { hi = lo + 1; }  // guard against flat fields
    scalarActiveRange = { min: lo, max: hi, unit: info.unit };
    updateScalarBar(layerName, scalarActiveRange);

    // Build a canvas colorized pixel-per-grid-cell, then wrap as imageOverlay.
    var canvas = document.createElement('canvas');
    canvas.width = nx;
    canvas.height = ny;
    var ctx = canvas.getContext('2d');
    var img = ctx.createImageData(nx, ny);

    for (var i = 0; i < values.length; i++) {
        var valDisplay = displayVals[i];
        var t = (valDisplay - lo) / (hi - lo);
        var rgb = interpColor(stops, Math.max(0, Math.min(1, t)));
        var off = i * 4;
        img.data[off]     = rgb[0];
        img.data[off + 1] = rgb[1];
        img.data[off + 2] = rgb[2];
        img.data[off + 3] = 170;  // ~67% opacity per-pixel
    }
    ctx.putImageData(img, 0, 0);

    // Grid metadata: la1 = northernmost, la2 = southernmost.
    var northLat = Math.max(h.la1, h.la2);
    var southLat = Math.min(h.la1, h.la2);
    var westLon = Math.min(h.lo1, h.lo2);
    var eastLon = Math.max(h.lo1, h.lo2);
    // Wrap 0..360 into -180..180 if needed (GFS native is 0..359.75).
    if (eastLon > 180) {
        westLon -= 360;
        eastLon -= 360;
    }
    var bounds = [[southLat, westLon], [northLat, eastLon]];

    if (scalarOverlayImage && map.hasLayer(scalarOverlayImage)) {
        map.removeLayer(scalarOverlayImage);
    }
    scalarOverlayImage = L.imageOverlay(canvas.toDataURL('image/png'), bounds, {
        opacity: 0.85,
        interactive: false,
        className: 'scalar-overlay-img',
    });
    scalarOverlayImage.addTo(map);
    // Push scalar below vector flow lines.
    scalarOverlayImage.bringToBack();
}

// ── Lazy-loaded hourly frames (Windy-style timeline) ──

var FRAMES_INDEX_URL = 'scheduled_results/frames/index.json';
var framesIndex = null;
var frameCache = { current: {}, wind: {} };  // hour → fetched data; GFS layers use scalarFrameCache keyed by "name|hour"
var currentFrameHour = 0;
var playTimer = null;

function frameUrl(type, hour) {
    return 'scheduled_results/frames/' + type + '/h' + String(hour).padStart(3, '0') + '.json';
}

function layerHours(type) {
    if (!framesIndex) return null;
    if (type === 'current' || type === 'wind') {
        return framesIndex[type] && framesIndex[type].hours;
    }
    var meta = framesIndex.layers && framesIndex.layers[type];
    return meta && meta.hours;
}

function layerBaseTime(type) {
    if (!framesIndex) return null;
    if (type === 'current' || type === 'wind') {
        return framesIndex[type] && framesIndex[type].base_time;
    }
    var meta = framesIndex.layers && framesIndex.layers[type];
    return meta && meta.base_time;
}

function nearestFrameHour(type, hour) {
    var hours = layerHours(type);
    if (!hours || !hours.length) return null;
    var best = hours[0], diff = Math.abs(hour - best);
    for (var i = 1; i < hours.length; i++) {
        var d = Math.abs(hour - hours[i]);
        if (d < diff) { best = hours[i]; diff = d; }
    }
    return best;
}

function fetchFrame(type, hour) {
    var isLegacy = (type === 'current' || type === 'wind');
    if (isLegacy) {
        if (frameCache[type][hour]) return Promise.resolve(frameCache[type][hour]);
    } else {
        var key = type + '|' + hour;
        if (scalarFrameCache[key]) return Promise.resolve(scalarFrameCache[key]);
    }
    var loading = document.getElementById('tlLoading');
    if (loading) loading.style.display = 'inline-block';
    return fetch(frameUrl(type, hour) + '?t=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error('frame ' + hour + ' missing'); return r.json(); })
        .then(function(data) {
            if (isLegacy) frameCache[type][hour] = data;
            else scalarFrameCache[type + '|' + hour] = data;
            return data;
        })
        .finally(function() { if (loading) loading.style.display = 'none'; });
}

function applyFrameToLayer(type, data) {
    var layer;
    if (type === 'current') layer = currentVelocityLayer;
    else if (type === 'wind') layer = windVelocityLayer;
    else if (isGfsVector(type)) {
        // Lazy-build the GFS wind layer on first frame arrival.
        if (!gfsVectorLayers[type]) {
            gfsVectorLayers[type] = buildVelocityLayerWithData(type, data);
        }
        layer = gfsVectorLayers[type];
        if (!map.hasLayer(layer)) map.addLayer(layer);
    }
    if (!layer) return;
    if (typeof layer.setData === 'function') layer.setData(data);
    else if (layer.options) {
        layer.options.data = data;
        if (map.hasLayer(layer)) { map.removeLayer(layer); map.addLayer(layer); }
    }
}

function setForecastHour(hour, opts) {
    opts = opts || {};
    currentFrameHour = hour;
    var slider = document.getElementById('tlSlider');
    if (slider && !opts.fromSlider) slider.value = hour;

    document.getElementById('tlLabel').textContent = 'T+' + hour + 'h';
    var t = document.getElementById('tlTime');
    var base = layerBaseTime(activeVelocityLayer);
    if (t && base) {
        var d = new Date(new Date(base).getTime() + hour * 3600 * 1000);
        t.textContent = d.toLocaleString('zh-TW', {
            timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
        });
    } else if (t) { t.textContent = ''; }

    // Update active vector layer
    var snapped = nearestFrameHour(activeVelocityLayer, hour);
    if (snapped != null) {
        fetchFrame(activeVelocityLayer, snapped).then(function(data) {
            if (currentFrameHour !== hour) return;
            applyFrameToLayer(activeVelocityLayer, data);
        }).catch(function(err) { console.warn(err); });
    }

    // Update active scalar overlay (if any)
    if (activeScalarLayer) {
        var sSnap = nearestFrameHour(activeScalarLayer, hour);
        if (sSnap != null) {
            fetchFrame(activeScalarLayer, sSnap).then(function(data) {
                if (currentFrameHour !== hour || !activeScalarLayer) return;
                renderScalarOverlay(data, activeScalarLayer);
            }).catch(function(err) { console.warn(err); });
        }
    }
}

function buildVelocityLayerWithData(type, data) {
    var isCurrent = type === 'current';
    var isGfsWind = isGfsVector(type);
    // Pressure-level winds are typically stronger than surface wind.
    var maxV = isCurrent ? 1.5 : (isGfsWind && type !== 'wind_10m' ? 30 : 15);
    return L.velocityLayer({
        displayValues: true,
        displayOptions: {
            velocityType: isCurrent ? 'Ocean Current' : (isGfsWind ? vectorLabel(type) : 'Wind'),
            displayPosition: 'bottomleft',
            displayEmptyString: 'No data',
            speedUnit: 'm/s',
            angleConvention: 'bearingCW',
        },
        data: data,
        maxVelocity: maxV,
        velocityScale: isCurrent ? 0.01 : 0.005,
        particleAge: 60,
        lineWidth: isCurrent ? 2 : 1.5,
        particleMultiplier: 1 / 200,
        colorScale: isCurrent
            ? ["#1a237e","#1565c0","#42a5f5","#29b6f6","#26c6da","#00e5ff","#76ff03","#ffeb3b","#ff9800","#f44336"]
            : ["#364fc7","#4c6ef5","#748ffc","#91a7ff","#bac8ff","#dbe4ff","#f8f9fa","#ffe8cc","#ffc078","#ff922b"],
        frameRate: 30,
        opacity: 0.92,
    });
}

function initFromFrames() {
    return fetch(FRAMES_INDEX_URL + '?t=' + Date.now()).then(function(r) {
        if (!r.ok) throw new Error('no frames');
        return r.json();
    }).then(function(idx) {
        framesIndex = idx;
        gfsLayerMeta = idx.layers || {};
        annotateLayerSelects();
        var maxH = idx.max_hours || 72;
        var slider = document.getElementById('tlSlider');
        slider.max = maxH;

        // Build initial layers from h0 frame for both types
        return Promise.all([
            fetchFrame('current', nearestFrameHour('current', 0)),
            fetchFrame('wind', nearestFrameHour('wind', 0)),
        ]).then(function(frames) {
            currentVelocityLayer = buildVelocityLayerWithData('current', frames[0]);
            windVelocityLayer = buildVelocityLayerWithData('wind', frames[1]);
            map.addLayer(currentVelocityLayer);
            updateVelocityBar('Ocean Current (m/s)', 1.5, 'current');

            document.getElementById('timeline').style.display = 'flex';
            wireTimeline();
            setForecastHour(0);
        });
    }).catch(function() { return null; });
}

// Keep every GFS option visible but mark the ones without frames so the user
// can see what's pending. Never remove options — pruning them made the UI
// look like the whole feature was missing when the data pipeline hadn't
// run yet.
function annotateLayerSelects() {
    var vsel = document.getElementById('vectorLayerSel');
    var ssel = document.getElementById('scalarLayerSel');
    function annotate(sel) {
        for (var i = 0; i < sel.options.length; i++) {
            var opt = sel.options[i];
            var val = opt.value;
            if (!val || val === 'current' || val === 'wind') continue;
            var meta = gfsLayerMeta[val];
            var hasData = meta && meta.hours && meta.hours.length;
            // Reset any earlier annotation so reloads don't stack suffixes.
            opt.textContent = opt.textContent.replace(/\s*\((無資料|no data)\)\s*$/, '');
            if (!hasData) {
                opt.textContent = opt.textContent + ' (無資料)';
                opt.disabled = true;
            } else {
                opt.disabled = false;
            }
        }
    }
    annotate(vsel);
    annotate(ssel);
}

function wireTimeline() {
    var slider = document.getElementById('tlSlider');
    var play = document.getElementById('tlPlay');
    var debounce;
    slider.addEventListener('input', function() {
        var h = parseInt(slider.value, 10);
        clearTimeout(debounce);
        debounce = setTimeout(function() { setForecastHour(h, { fromSlider: true }); }, 80);
    });
    play.addEventListener('click', function() {
        if (playTimer) {
            clearInterval(playTimer); playTimer = null;
            play.classList.remove('playing'); play.innerHTML = '&#9654;'; return;
        }
        play.classList.add('playing'); play.innerHTML = '&#10074;&#10074;';
        playTimer = setInterval(function() {
            var max = parseInt(slider.max, 10);
            var next = (currentFrameHour + 1) > max ? 0 : currentFrameHour + 1;
            setForecastHour(next);
        }, 600);
    });
}

// Try frames first; fall back to single-snapshot files if frames not present
initFromFrames().then(function(ok) {
    if (ok !== null) return;
    // Fallback path — no frames index at all. Mark every GFS option as
    // "(無資料)" so the user knows why those layers can't be activated.
    annotateLayerSelects();
    Promise.all([
        loadVelocityLayer(CURRENT_VELOCITY_URL, 'current'),
        loadVelocityLayer(WIND_VELOCITY_URL, 'wind'),
    ]).then(function() {
        if (currentVelocityLayer) {
            map.addLayer(currentVelocityLayer);
            updateVelocityBar('Ocean Current (m/s)', 1.5, 'current');
        }
    });
});

// ── Trajectory drawing ──

function drawGeoJSON(geojson, color) {
    trajectoryLayer.clearLayers();

    geojson.features.forEach(function(feature) {
        var props = feature.properties;

        if (props.type === 'trajectory') {
            var coords = feature.geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
            L.polyline(coords, {
                color: color, weight: 1.5, opacity: 0.4,
            }).addTo(trajectoryLayer);
        }
        else if (props.type === 'start') {
            L.circleMarker([feature.geometry.coordinates[1], feature.geometry.coordinates[0]], {
                radius: 8, color: '#ff4444', fillColor: '#ff4444', fillOpacity: 0.9, weight: 2,
            }).bindPopup('<b>Start</b><br>' + feature.geometry.coordinates[1].toFixed(4) + ', ' + feature.geometry.coordinates[0].toFixed(4))
              .addTo(trajectoryLayer);
        }
        else if (props.type === 'end_center') {
            L.circleMarker([feature.geometry.coordinates[1], feature.geometry.coordinates[0]], {
                radius: 6, color: '#34d399', fillColor: '#34d399', fillOpacity: 0.9, weight: 2,
            }).bindPopup('<b>End (mean)</b><br>' + feature.geometry.coordinates[1].toFixed(4) + ', ' + feature.geometry.coordinates[0].toFixed(4))
              .addTo(trajectoryLayer);
        }
        else if (props.type === 'end_hull') {
            var hullCoords = feature.geometry.coordinates[0].map(function(c) { return [c[1], c[0]]; });
            L.polygon(hullCoords, {
                color: 'orange', fillColor: 'orange', fillOpacity: 0.15, weight: 2, dashArray: '5,5',
            }).bindPopup('<b>Spread Area</b>')
              .addTo(trajectoryLayer);
        }
    });
}

function selectPoint(id) {
    if (activePointId === id) return;
    activePointId = id;

    document.querySelectorAll('.point-item, .strip-card').forEach(function(el) {
        el.classList.toggle('active', el.dataset.id === id);
    });

    var pt = pointData[id];
    if (!pt) return;

    var panel = document.getElementById('infoPanel');
    panel.style.display = 'block';
    document.getElementById('infoPanelTitle').textContent = pt.name_zh + ' / ' + pt.name;
    document.getElementById('infoPanelCoords').textContent = pt.lat + ', ' + pt.lon;

    var imgWrap = document.getElementById('infoPanelImageWrap');
    var imgEl = document.getElementById('infoPanelImage');
    if (pt.image) {
        imgEl.src = 'scheduled_results/' + pt.image + '?t=' + Date.now();
        imgEl.alt = pt.name_zh + ' simulation';
        imgWrap.style.display = 'block';
    } else {
        imgWrap.style.display = 'none';
        imgEl.removeAttribute('src');
    }

    if (pt.geojson) {
        fetch('scheduled_results/' + pt.geojson + '?t=' + Date.now())
            .then(function(r) {
                if (!r.ok) throw new Error('GeoJSON not found');
                return r.json();
            })
            .then(function(geojson) {
                var idx = Object.keys(pointData).indexOf(id);
                drawGeoJSON(geojson, COLORS[idx % COLORS.length]);
                document.getElementById('infoPanelParticles').textContent = geojson.properties.num_particles || '--';
                document.getElementById('infoPanelDuration').textContent = (geojson.properties.num_steps || '--') + ' steps';

                if (trajectoryLayer.getLayers().length > 0) {
                    map.fitBounds(trajectoryLayer.getBounds(), { padding: [40, 40] });
                }
            })
            .catch(function() {
                trajectoryLayer.clearLayers();
                document.getElementById('infoPanelParticles').textContent = '--';
                document.getElementById('infoPanelDuration').textContent = '--';
            });
    } else {
        trajectoryLayer.clearLayers();
        map.setView([pt.lat, pt.lon], 9);
        document.getElementById('infoPanelParticles').textContent = pt.image ? '300' : '--';
        document.getElementById('infoPanelDuration').textContent = pt.image ? '24h' : '--';
    }
}

// Lightbox + collapse/shrink controls for simulation image
(function() {
    var lb = document.getElementById('simLightbox');
    var lbImg = document.getElementById('simLightboxImg');
    var lbClose = document.getElementById('simLightboxClose');
    var wrap = document.getElementById('infoPanelImageWrap');
    var thumb = document.getElementById('infoPanelImage');
    var panel = document.getElementById('infoPanel');
    var toggleBtn = document.getElementById('infoPanelToggle');

    // Three states cycle on toggle. Default is "shrunk" (44px strip) so the
    // image hints at content without dominating the bottom of the screen.
    // Cycle: shrunk → collapsed (title only) → full → shrunk …
    var STATES = ['shrunk', 'collapsed', 'full'];
    var saved = localStorage.getItem('seacurrent.infoPanel');
    var state = STATES.indexOf(saved) >= 0 ? saved : 'shrunk';

    function applyState() {
        panel.classList.toggle('collapsed', state === 'collapsed');
        wrap.classList.toggle('shrunk', state === 'shrunk');
        // Icon hints at the next state in the cycle.
        toggleBtn.innerHTML = state === 'shrunk' ? '&#x2715;' :    // ✕ → next: hide
            state === 'collapsed' ? '&#x25BC;' :                   // ▼ → next: expand
            '&#x2013;';                                            // – → next: shrink
        toggleBtn.title = state === 'shrunk' ? 'Hide image'
            : state === 'collapsed' ? 'Expand'
            : 'Shrink image';
    }
    function cycle() {
        state = STATES[(STATES.indexOf(state) + 1) % STATES.length];
        localStorage.setItem('seacurrent.infoPanel', state);
        applyState();
    }
    toggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        cycle();
    });
    applyState();

    function open() {
        if (!thumb.src) return;
        lbImg.src = thumb.src;
        lb.classList.add('open');
    }
    function close() {
        lb.classList.remove('open');
        lbImg.removeAttribute('src');
    }
    wrap.addEventListener('click', open);
    lbClose.addEventListener('click', close);
    lb.addEventListener('click', function(e) { if (e.target === lb) close(); });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lb.classList.contains('open')) close();
    });
})();

async function loadForecast() {
    var loadingMsg = document.getElementById('loadingMsg');
    var pointList = document.getElementById('pointList');

    try {
        var resp = await fetch(MANIFEST_URL + '?t=' + Date.now());
        if (!resp.ok) {
            loadingMsg.textContent = 'No forecast data yet. Run the Scheduled Drift Forecast workflow first.';
            pointList.innerHTML = '<div style="padding:20px;color:#f87171;text-align:center;">No data</div>';
            return;
        }

        var manifest = await resp.json();
        loadingMsg.style.display = 'none';

        var genDate = new Date(manifest.generated_at);
        document.getElementById('metaInfo').innerHTML =
            '<span>Updated:</span> ' + genDate.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }) +
            ' | <span>Duration:</span> ' + manifest.duration_hours + 'h' +
            ' | <span>Model:</span> ' + manifest.model;

        var points = manifest.points || [];
        pointList.innerHTML = '';
        var strip = document.getElementById('forecastStrip');
        if (strip) strip.innerHTML = '';

        points.forEach(function(pt, idx) {
            pointData[pt.id] = pt;

            var marker = L.circleMarker([pt.lat, pt.lon], {
                radius: 7,
                color: COLORS[idx % COLORS.length],
                fillColor: COLORS[idx % COLORS.length],
                fillOpacity: 0.7,
                weight: 2,
            }).addTo(map);
            marker.bindTooltip(pt.name_zh, { permanent: true, direction: 'right', className: 'point-tooltip' });
            marker.on('click', function() { selectPoint(pt.id); });
            pointMarkers[pt.id] = marker;

            var thumbHTML = pt.image
                ? '<div class="thumb"><img src="scheduled_results/' + pt.image + '?t=' + Date.now() + '" alt="' + pt.name + '" loading="lazy"></div>'
                : '';

            var item = document.createElement('div');
            item.className = 'point-item';
            item.dataset.id = pt.id;
            item.innerHTML =
                '<div class="name-zh">' + pt.name_zh + '</div>' +
                '<div class="name-en">' + pt.name + '</div>' +
                '<div class="coords">' + pt.lon + ', ' + pt.lat + '</div>' +
                (pt.status === 'ok'
                    ? '<div class="status-ok">&#x2713; Simulation OK</div>'
                    : '<div class="status-err">&#x2717; ' + pt.status + '</div>') +
                thumbHTML;
            item.addEventListener('click', function() { selectPoint(pt.id); });
            pointList.appendChild(item);

            if (strip && pt.image) {
                var card = document.createElement('button');
                card.type = 'button';
                card.className = 'strip-card';
                card.dataset.id = pt.id;
                card.innerHTML =
                    '<div class="strip-thumb"><img src="scheduled_results/' + pt.image + '?t=' + Date.now() + '" alt="' + pt.name + '" loading="lazy"></div>' +
                    '<div class="strip-name">' + pt.name_zh + '</div>';
                card.addEventListener('click', function() { selectPoint(pt.id); });
                strip.appendChild(card);
            }
        });

        document.getElementById('legend').style.display = 'block';

        if (points.length > 0) selectPoint(points[0].id);

    } catch (err) {
        loadingMsg.textContent = 'Failed to load: ' + err.message;
        pointList.innerHTML = '<div style="padding:20px;color:#f87171;text-align:center;">Error</div>';
    }
}

if (!EMBED_MODE) loadForecast();

// ── Embed-mode auto cycle ──
// Rotates through a small set of vector/scalar presets so the iframe on
// the landing page showcases wind, current, temperature, and humidity
// without user interaction — but stops as soon as the visitor picks a
// layer themselves.
if (EMBED_MODE) {
    var EMBED_PRESETS_GFS = [
        { vector: 'current',  scalar: '' },
        { vector: 'current',  scalar: 'temp_2m' },
        { vector: 'wind_10m', scalar: '' },
        { vector: 'wind_10m', scalar: 'rh_2m' },
    ];
    var EMBED_PRESETS_FALLBACK = [
        { vector: 'current', scalar: '' },
        { vector: 'wind',    scalar: '' },
    ];
    var embedCycleTimer = null;
    var embedCycleIdx = 0;

    function stopEmbedCycle() {
        if (embedCycleTimer) {
            clearInterval(embedCycleTimer);
            embedCycleTimer = null;
        }
    }

    function startEmbedCycle() {
        if (embedCycleTimer) return;
        var hasGfs = !!framesIndex && framesIndex.layers &&
                     Object.keys(framesIndex.layers).indexOf('wind_10m') !== -1;
        var presets = hasGfs ? EMBED_PRESETS_GFS : EMBED_PRESETS_FALLBACK;
        var vecSel    = document.getElementById('vectorLayerSel');
        var scalarSel = document.getElementById('scalarLayerSel');
        function step() {
            var p = presets[embedCycleIdx % presets.length];
            embedCycleIdx++;
            try {
                if (vecSel)    vecSel.value    = p.vector;
                if (scalarSel) scalarSel.value = p.scalar;
                selectVectorLayer(p.vector);
                selectScalarOverlay(p.scalar);
            } catch (e) { /* layer not ready yet — skip this tick */ }
        }
        step();                           // switch immediately to the first preset
        embedCycleTimer = setInterval(step, 8000);
    }

    // Stop cycling as soon as the visitor interacts with either dropdown.
    ['vectorLayerSel', 'scalarLayerSel'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', stopEmbedCycle);
    });

    // Wait until either GFS frames or the fallback current layer is ready,
    // then start cycling. Poll briefly — loadForecast is fetch-based and
    // finishes quickly in the common case.
    var embedReadyTries = 0;
    var embedReadyTimer = setInterval(function() {
        embedReadyTries++;
        var ready = !!framesIndex || !!currentVelocityLayer;
        if (ready || embedReadyTries > 40) {  // give up after ~20 s
            clearInterval(embedReadyTimer);
            if (ready) startEmbedCycle();
        }
    }, 500);
}
</script>
